name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Gradle 9.2.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.2.1-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /opt
          echo "/opt/gradle-9.2.1/bin" >> "$GITHUB_PATH"

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tpakill-modssssss
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
